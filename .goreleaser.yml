version: 2

project_name: ai9s

before:
  hooks:
    - go mod download

release:
  prerelease: false

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/AymanZahran/ai9s/cmd.version={{ .Version }} -X github.com/AymanZahran/ai9s/cmd.commit={{ .Commit }} -X github.com/AymanZahran/ai9s/cmd.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}amd64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: checksums.sha256

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

nfpms:
  - file_name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    maintainer: Ayman Zahran <ah.zahran@outlook.com>
    homepage: https://ai9scli.io
    description: Keyboard-first finder for local AI coding sessions
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

sboms:
  - artifacts: archive
